server {
    listen 80;
    server_name localhost;

    # Увеличиваем максимальный размер загружаемого файла (например, до 50 мегабайт)
    client_max_body_size 50M;

    # 1. Роутинг для API (все запросы, начинающиеся с /api)
    location /api/ {
        proxy_pass http://backend:4200;

        # Стандартные заголовки для проксирования
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Роутинг для Фронтенда (Next.js) - все остальные запросы
    location / {
        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}